name: end-to-end-qa

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: disposable-plan-e2e
  cancel-in-progress: false

jobs:
  qa-automated:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'end-to-end-qa') &&
      (github.event.pull_request.user.login == 'justinfiore' ||
       github.event.pull_request.user.login == 'jhorgenson')
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      PARENT_ACCESS_TOKEN: ${{ secrets.PARENT_ACCESS_TOKEN }}
      JORSTEN_JR_ACCESS_TOKEN: ${{ secrets.JORSTEN_JR_ACCESS_TOKEN }}
      BORSTEN_ACCESS_TOKEN: ${{ secrets.BORSTEN_ACCESS_TOKEN }}
      THORSTEN_ACCESS_TOKEN: ${{ secrets.THORSTEN_ACCESS_TOKEN }}
      QA_PARENT_PLAN_ID: ${{ secrets.QA_PARENT_PLAN_ID }}
      QA_JORSTEN_JR_PLAN_ID: ${{ secrets.QA_JORSTEN_JR_PLAN_ID }}
      QA_BORSTEN_PLAN_ID: ${{ secrets.QA_BORSTEN_PLAN_ID }}
      QA_THORSTEN_PLAN_ID: ${{ secrets.QA_THORSTEN_PLAN_ID }}
      QA_CONFIRM_LIVE_MUTATIONS: YES

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Install QA config placeholders
        run: cp qa/config/qa-sync.yaml.example qa/config/qa-sync.yaml

      - name: Run automated disposable-plan QA
        run: ./gradlew --no-daemon qaAutomated -PqaConfirmLive=YES

      - name: Upload JUnit XML test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: qa-automated-junit
          path: build/test-results/
          if-no-files-found: error
          retention-days: 1

      - name: Publish test result summary to job summary
        if: always()
        run: python3 .github/scripts/publish_test_summary.py
