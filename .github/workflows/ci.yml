name: ci

on:
  push:
    branches:
      - master
      - 'opsx-*'
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
      - 'docs/**'
      - 'ci/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read
  checks: write

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Show Java and Gradle environment
        run: |
          java -version
          ./gradlew --version

      - name: Run verification test suite
        run: ./gradlew --no-daemon testAll

      - name: Build installDist distribution
        run: ./gradlew --no-daemon installDist

      - name: Upload JUnit XML test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: junit-test-results
          path: build/test-results/
          if-no-files-found: error
          retention-days: 1

      - name: Publish JUnit results as a GitHub Check
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2
        with:
          name: CI JUnit Test Results
          path: build/test-results/**/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload HTML test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: html-test-report
          path: build/reports/tests/
          if-no-files-found: error
          retention-days: 1

      - name: Upload installDist output
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: install-dist
          path: build/install/
          if-no-files-found: error
          retention-days: 1

      - name: Publish test result summary to job summary
        if: always()
        run: python3 .github/scripts/publish_test_summary.py
