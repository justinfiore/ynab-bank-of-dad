name: ci

on:
  push:
    branches:
      - master
      - 'opsx-*'
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
      - 'docs/**'
      - 'ci/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Show Java and Gradle environment
        run: |
          java -version
          ./gradlew --version

      - name: Run verification test suite
        run: ./gradlew --no-daemon testAll

      - name: Build installDist distribution
        run: ./gradlew --no-daemon installDist

      - name: Upload JUnit XML test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: junit-test-results
          path: build/test-results/
          if-no-files-found: error

      - name: Upload HTML test reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: html-test-report
          path: build/reports/tests/
          if-no-files-found: error

      - name: Upload installDist output
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: install-dist
          path: build/install/
          if-no-files-found: error
