plugins {
    id 'groovy'
    id 'application'
}

repositories {
    mavenCentral()
}

application {
    mainClass = 'ynabbankofdad.allowance.RecordAllowance'
}

tasks.register('runSyncer', JavaExec) {
    group = 'application'
    description = 'Runs the standalone parent-child budget syncer.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ynabbankofdad.sync.ParentChildBudgetSyncer'
}

tasks.register('qaInspectProvisioning', JavaExec) {
    group = 'verification'
    description = 'Compares an offline QA discovery snapshot with required provisioning.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ynabbankofdad.qa.QaProvisioningInspectorCli'
}

def integrationTestPatterns = ['**/*WireMockSpec.class', '**/*IntegrationSpec.class']
def nonIntegrationTestExcludes = integrationTestPatterns

dependencies {
    implementation 'org.apache.groovy:groovy:5.0.6'
    implementation 'org.apache.groovy:groovy-json:5.0.6'
    implementation 'org.apache.groovy:groovy-xml:5.0.6'
    implementation 'org.apache.groovy:groovy-datetime:5.0.6'
    implementation 'org.apache.groovy:groovy-cli-picocli:5.0.6'
    implementation 'org.yaml:snakeyaml:2.5'
    implementation 'org.apache.commons:commons-lang3:3.7'
    implementation 'commons-cli:commons-cli:1.4'
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'ch.qos.logback:logback-classic:1.5.20'
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    testImplementation 'org.spockframework:spock-core:2.4-groovy-5.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.wiremock:wiremock:3.0.1'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    reports {
        junitXml.required = true
        html.required = true
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.named('test', Test) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Runs unit tests only.'
    exclude(nonIntegrationTestExcludes)
}

def integrationTestTask = tasks.register('integrationTest', Test) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Runs integration tests only.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include(integrationTestPatterns)
    mustRunAfter(tasks.named('test'))
}

def combinedTestTask = tasks.register('testAll') {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Runs unit tests first, then integration tests if unit tests pass.'
    dependsOn(tasks.named('test'))
    dependsOn(integrationTestTask)
}

tasks.named('check') {
    dependsOn(combinedTestTask)
}

def qaPython = providers.gradleProperty('qaPython').orElse('python3')
def qaConfirmLive = providers.gradleProperty('qaConfirmLive').orElse('')
def qaManualReady = providers.gradleProperty('qaManualReady').orElse('')

tasks.register('qaAutomated', Exec) {
    group = 'qa'
    description = 'Runs disposable YNAB QA scenarios that need no UI. Not part of test/build/check.'
    workingDir = layout.projectDirectory
    commandLine qaPython.get(), 'qa/run_qa_suite.py', '--suite', 'automated'
    environment 'QA_CONFIRM_LIVE_MUTATIONS', qaConfirmLive.get() == 'YES' ? 'YES' : ''
}

tasks.register('qaManual', Exec) {
    group = 'qa'
    description = 'Prepares or continues UI-gated disposable YNAB QA (A8/B5/C8). Not part of test/build/check.'
    workingDir = layout.projectDirectory
    def args = ['qa/run_qa_suite.py', '--suite', 'manual']
    if (qaManualReady.get() == 'YES') {
        args.add('--ui-complete')
    }
    commandLine qaPython.get(), *args
    environment 'QA_CONFIRM_LIVE_MUTATIONS', qaConfirmLive.get() == 'YES' ? 'YES' : ''
}
