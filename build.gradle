plugins {
    id 'groovy'
    id 'application'
}

repositories {
    mavenCentral()
}

application {
    mainClass = 'RecordAllowance'
}

dependencies {
    implementation 'org.apache.groovy:groovy:5.0.6'
    implementation 'org.apache.groovy:groovy-json:5.0.6'
    implementation 'org.apache.groovy:groovy-xml:5.0.6'
    implementation 'org.apache.groovy:groovy-datetime:5.0.6'
    implementation 'org.apache.groovy:groovy-cli-picocli:5.0.6'
    implementation 'org.apache.commons:commons-lang3:3.7'
    implementation 'commons-cli:commons-cli:1.4'
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'ch.qos.logback:logback-classic:1.5.20'
    testImplementation 'org.spockframework:spock-core:2.4-groovy-5.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.wiremock:wiremock:3.0.1'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    reports {
        junitXml.required = true
        html.required = true
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

